name: "Branches"

on:
  push:
    branches: [ "feat/*", "fix/*", "refactor/*", "chore/*", "docs/*", "test/*", "build/*", "perf/*", "style/*", "revert/*" ]
  pull_request:
    branches: [ "feat/*", "fix/*", "refactor/*", "chore/*", "docs/*", "test/*", "build/*", "perf/*", "style/*", "revert/*" ]
  workflow_dispatch: # Permite la ejecución manual

jobs:
  commons:
    uses: ./.github/workflows/commons.yml

  extra-steps:
    runs-on: ubuntu-latest
    needs: commons
    steps:
      - name: "🔍 Code Analysis"
        run: echo "Running additional code analysis tools..."
      - name: "📧 Send Notification"
        run: echo "Sending notification email for develop build..."

